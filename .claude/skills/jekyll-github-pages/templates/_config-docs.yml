# Documentation Site Configuration for Jekyll + GitHub Pages
# Copy this to your site's _config.yml and customize

# Site Settings
title: Your Project Documentation
description: Comprehensive documentation for Your Project
author: Your Name / Your Team
email: support@example.com

# URL Configuration
# For user site (username.github.io): leave baseurl empty
# For project site: set baseurl to "/repo-name"
url: "https://username.github.io"
baseurl: "/project-name"

# Build Settings
markdown: kramdown
kramdown:
  input: GFM  # GitHub Flavored Markdown
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: html

theme: minima
# Or use documentation-focused themes:
# remote_theme: pmarsceill/just-the-docs
# remote_theme: mmistakes/minimal-mistakes

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections - Documentation Sections
collections:
  docs:
    output: true
    permalink: /docs/:name/
  api:
    output: true
    permalink: /api/:name/
  guides:
    output: true
    permalink: /guides/:name/

# Default Front Matter
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
      toc: true
  - scope:
      path: ""
      type: "api"
    values:
      layout: "api"
      toc: true
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
      toc: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Documentation Settings
docs:
  show_toc: true
  show_breadcrumbs: true
  show_last_modified: true
  show_edit_on_github: true

# GitHub Repository (for "Edit on GitHub" links)
github:
  repository_url: "https://github.com/username/repo-name"
  branch: "main"

# Navigation (customize based on your docs structure)
navigation:
  - title: Getting Started
    url: /docs/getting-started/
    children:
      - title: Installation
        url: /docs/installation/
      - title: Quick Start
        url: /docs/quick-start/
      - title: Configuration
        url: /docs/configuration/

  - title: User Guide
    url: /guides/
    children:
      - title: Basic Usage
        url: /guides/basic-usage/
      - title: Advanced Features
        url: /guides/advanced-features/
      - title: Best Practices
        url: /guides/best-practices/

  - title: API Reference
    url: /api/
    children:
      - title: API Overview
        url: /api/overview/
      - title: Authentication
        url: /api/authentication/
      - title: Endpoints
        url: /api/endpoints/

  - title: Resources
    url: /resources/
    children:
      - title: FAQ
        url: /resources/faq/
      - title: Troubleshooting
        url: /resources/troubleshooting/
      - title: Changelog
        url: /resources/changelog/

# Search (if theme supports)
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Version
version: "1.0.0"

# Social Links
github_username: yourusername
twitter_username: yourproject

# SEO Settings
social:
  name: Your Project
  links:
    - https://github.com/username/project-name
    - https://twitter.com/yourproject

# Google Analytics (optional)
# google_analytics: UA-NNNNNNNN-N

# Code Highlighting
highlighter: rouge

# Syntax Highlighting Theme
# Options: base16, colorful, github, gruvbox, monokai, murphy, pastie, thankful_eyes, tulip
rouge_theme: github

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .gitignore
  - CONTRIBUTING.md

# Include files
include:
  - _pages

# Timezone
timezone: America/New_York

# Show future posts
future: false

# Liquid Options
liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false
