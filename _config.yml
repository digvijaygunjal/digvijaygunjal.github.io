# Site: https://digvijaygunjal.github.io
# User-site repo, so baseurl stays empty.
title: Recipes
description: Pressure-cooker and one-pot recipes calibrated for the Instant Pot Pro Max, written so any recipe app can import them straight from the URL.
author: Digvijay Gunjal
lang: en

# Rendered in the footer of every page. Named social_links rather than social,
# which jekyll-seo-tag reserves for a differently shaped hash.
social_links:
  - name: GitHub
    url: https://github.com/digvijaygunjal
  - name: Instagram
    url: https://www.instagram.com/digvijay.gunjal/
  - name: LinkedIn
    url: https://www.linkedin.com/in/digvijay-gunjal-6860b68a
  - name: X
    url: https://x.com/DigvijayGunjal

url: "https://digvijaygunjal.github.io"
baseurl: ""

# We ship our own layouts and CSS; disable the GitHub Pages default theme.
theme: null

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
